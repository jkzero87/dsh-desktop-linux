# Build the unsigned Linux x64 desktop AppImage when a v* tag is pushed. This
# workflow only packages the app and retains the artifact: it publishes nothing,
# performs no upload to a release feed, and never appears as a pull-request check.
name: Release (linux desktop)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # One build per tag; re-running a tag displaces its earlier attempt.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Build unsigned linux-x64 AppImage
    runs-on: ubuntu-latest
    steps:
      # Complete history: the packaging reads the checkout's commit.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Packaging reads the git-ignored apps/desktop/.env.linux. This is the minimal
      # file from README-LINUX.md and carries no secrets.
      - name: Create apps/desktop/.env.linux
        run: |
          cat > apps/desktop/.env.linux <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=
          DOWNLOAD_TEST_RELEASE_ID=
          EOF

      # --unsigned packs the AppImage with no signing and no update feed into the
      # target's unsigned-artifacts directory.
      - name: Build unsigned linux-x64 AppImage
        working-directory: apps/desktop
        run: pnpm exec tsx scripts/package-target.ts linux-x64 --unsigned

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64-unsigned-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14
